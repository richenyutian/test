spring:
  application:
    name: ticket-system
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

ticket:
  demo-users:
    - admin
    - creator01
    - reviewer01
    - handler01
    - closer01
